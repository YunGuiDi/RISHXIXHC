<!DOCTYPE html> <html lang="zh-Hant"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <title>外送餐飲使用頻率與滿意度問卷</title> <style> :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); --bg:#f0ebf8; --card:#fff; --tx:#202124; --sub:#5f6368; --pr:#673ab7; --pr-hover:#5e35b1; --bd:#dadce0; --focus:#4285f4; --danger:#d93025; --hover:#f8f7fc; } @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#1f1a2b; --card:#2a2438; --tx:#e8eaed; --sub:#a8abb0; --pr:#b39ddb; --pr-hover:#9575cd; --bd:#4a4458; --hover:#332d43; } } :root[data-theme="dark"]{ --bg:#1f1a2b; --card:#2a2438; --tx:#e8eaed; --sub:#a8abb0; --pr:#b39ddb; --pr-hover:#9575cd; --bd:#4a4458; --hover:#332d43; } html{ scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth; } *{ box-sizing:border-box; } body{ margin:0; background:var(--bg); color:var(--tx); font-family: Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif; font-size:14px; line-height:1.5; letter-spacing:.2px; } .wrap{ width:100%; max-width:700px; margin:0 auto; padding:12px 12px 40px; } /* ========================================================= Google Forms 頁面切換 ========================================================= */ .tabs{ display:none; } .tabs button{ flex:1; padding:10px; border:1px solid var(--bd); background:var(--card); color:var(--tx); border-radius:8px; cursor:pointer; font-size:15px; } .tabs button.on{ background:var(--pr); color:#fff; border-color:var(--pr); } /* ========================================================= Google Forms 卡片 ========================================================= */ .card{ background:var(--card); border:1px solid var(--bd); border-radius:8px; padding:24px; margin-bottom:12px; position:relative; box-shadow:0 1px 2px rgba(60,64,67,.12); } .card:focus-within:not(.head){ border-left:6px solid var(--focus); padding-left:19px; } /* ========================================================= 表單標題區 ========================================================= */ .head{ border-top:10px solid var(--pr); padding:28px 28px 26px; } h1{ margin:0 0 14px; font-size:32px; font-weight:400; line-height:1.25; color:var(--tx); } h2{ margin:0 0 18px; font-size:16px; font-weight:400; line-height:1.5; color:var(--tx); } .sub{ color:var(--sub); font-size:13px; line-height:1.65; } .req::after{ content:" *"; color:var(--danger); } .rq{ color:var(--danger); font-size:13px; margin-top:18px; } /* ========================================================= 題目 ========================================================= */ #qs{ width:100%; } #qs .card{ padding:24px 28px 26px; } label.opt{ display:flex; align-items:center; gap:14px; min-height:40px; padding:7px 6px; margin-left:-6px; border-radius:4px; cursor:pointer; color:var(--tx); } label.opt:hover{ background:var(--hover); } /* ========================================================= Google Forms 圓形單選 / 方形複選 ========================================================= */ input[type=radio], input[type=checkbox]{ appearance:none; -webkit-appearance:none; flex:0 0 auto; width:20px; height:20px; margin:0; background:var(--card); border:2px solid #5f6368; cursor:pointer; position:relative; } input[type=radio]{ border-radius:50%; } input[type=checkbox]{ border-radius:2px; } input[type=radio]:checked{ border:6px solid var(--pr); } input[type=checkbox]:checked{ background:var(--pr); border-color:var(--pr); } input[type=checkbox]:checked::after{ content:""; position:absolute; left:5px; top:1px; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); } input[type=radio]:focus-visible, input[type=checkbox]:focus-visible{ outline:3px solid rgba(66,133,244,.25); outline-offset:2px; } /* ========================================================= 線性量表 ========================================================= */ .scroll{ width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; } table.lk{ border-collapse:collapse; width:100%; min-width:560px; } table.lk th{ font-weight:400; font-size:12px; color:var(--sub); padding:4px 5px 10px; text-align:center; vertical-align:bottom; } table.lk th:first-child{ width:210px; text-align:left; } table.lk td{ text-align:center; padding:11px 4px; border-top:1px solid var(--bd); } table.lk tr:nth-child(even) td{ background:rgba(128,128,128,.05); } table.lk td:first-child{ text-align:left; font-size:14px; min-width:180px; color:var(--tx); } /* ========================================================= Google Forms 按鈕 ========================================================= */ .btn{ background:var(--pr); color:#fff; border:0; border-radius:4px; padding:10px 24px; min-height:40px; font-size:14px; font-weight:500; cursor:pointer; margin:4px 12px 4px 0; font-family:inherit; transition: background .15s ease, box-shadow .15s ease, filter .15s ease; } .btn:hover{ background:var(--pr-hover); box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px rgba(60,64,67,.15); } .btn:focus-visible{ outline:3px solid rgba(66,133,244,.25); outline-offset:2px; } .btn.sec{ background:transparent; color:var(--pr); padding:10px 8px; box-shadow:none; } .btn.sec:hover{ background:rgba(103,58,183,.08); box-shadow:none; } /* ========================================================= 底部 ========================================================= */ .ft{ text-align:left; color:var(--sub); font-size:12px; line-height:1.65; margin:20px 4px 8px; } .ft a{ color:var(--pr); cursor:pointer; text-decoration:none; } .ft a:hover{ text-decoration:underline; } /* ========================================================= 錯誤 ========================================================= */ .err{ color:var(--danger); font-size:13px; margin-top:6px; min-height:20px; } .hide{ display:none !important; } /* ========================================================= 分析表 ========================================================= */ table.rs{ border-collapse:collapse; width:100%; font-size:14px; } table.rs th, table.rs td{ border-bottom:1px solid var(--bd); padding:8px 6px; text-align:right; } table.rs th{ font-weight:500; color:var(--sub); } table.rs th:first-child, table.rs td:first-child{ text-align:left; } /* ========================================================= SVG ========================================================= */ svg text{ fill:var(--tx); font-family:inherit; } /* ========================================================= 手機版 ========================================================= */ @media(max-width:600px){ .wrap{ padding:0 0 32px; } .card{ border-left:0; border-right:0; border-radius:0; box-shadow:none; margin-bottom:8px; } .head{ border-top-width:8px; padding:25px 20px 24px; } #qs .card{ padding:22px 20px 24px; } h1{ font-size:25px; } h2{ font-size:16px; } label.opt{ min-height:44px; } .ft{ padding:0 16px; } table.lk{ min-width:560px; } } /* ========================================================= 小螢幕 ========================================================= */ @media(max-width:380px){ h1{ font-size:23px; } .head{ padding-left:16px; padding-right:16px; } #qs .card{ padding-left:16px; padding-right:16px; } } </style> </head> <body> <div class="wrap"> <div class="tabs"> <button id="t1" class="on" onclick="tab(1)">問卷填寫</button> <button id="t2" onclick="tab(2)">路徑分析結果</button> </div> <!-- ======================================================= 問卷 ======================================================= --> <div id="p1"> <form id="f" onsubmit="return false"> <div class="card head"> <h1>外送餐飲使用頻率與滿意度調查</h1> <div class="sub"> 您好！本問卷為學術研究用途，探討外送平台使用頻率、滿意度與推薦意願之關係。 採匿名填答，資料僅作統計分析，約需 3 分鐘，不需要登入Google帳號，我恨透Google了。 <br> </div> <div class="rq"> * 表示必填問題 </div> </div> <div id="qs"></div> <!-- Google Forms 底部操作 --> <div style="padding:4px 4px 0;"> <button type="button" class="btn" onclick="submitF()"> 提交 </button> <button type="button" class="btn sec" onclick="document.getElementById('f').reset()"> 清除表單 </button> </div> <div id="msg" class="err"></div> </form> <div class="ft"> 此為自製Google學術問卷，與任何第三方Google服務無關。 請勿在此填寫密碼或敏感個資，陳建仲關心你。 <br> <a onclick="tab(2)"> 檢視分析結果 </a> </div> </div> <!-- ======================================================= 分析 ======================================================= --> <div id="p2" class="hide"> <div class="card"> <h2>回收概況</h2> <button class="btn sec" onclick="location.reload()"> ← 回到問卷 </button> <div id="n" class="sub"></div> <button class="btn" onclick="demo()"> 產生 60 筆模擬資料 </button> <button class="btn sec" onclick="csv()"> 匯出 CSV </button> <button class="btn sec" onclick="clr()"> 清除資料 </button> </div> <div class="card"> <h2> 路徑圖（標準化係數 β） </h2> <div class="scroll"> <svg id="svg" viewBox="0 0 640 260" width="100%"> </svg> </div> </div> <div class="card"> <h2> 路徑係數表 </h2> <div class="scroll" id="tbl"> </div> <div class="sub" id="note"> </div> </div> </div> </div> <script> /* ========================================================= 原始問卷資料 —— 完整保留 ========================================================= */ const LK=[ "非常不同意", "不同意", "普通", "同意", "非常同意" ]; const Q=[ { id:"gender", t:"1. 性別", o:[ "男", "女", "其他/不願透露" ], req:1 }, { id:"age", t:"2. 年齡", o:[ "18 歲以下", "19–25 歲", "26–35 歲", "36–45 歲", "46 歲以上" ], req:1 }, { id:"freq", t:"3. 您平均每個月使用外送平台訂餐的次數？", o:[ "1 次以下", "1–3 次", "4–6 次", "7–10 次", "11 次以上" ], req:1, n:1 }, { id:"plat", t:"4. 您最常使用的外送平台（可複選）", o:[ "Uber Eats", "foodpanda", "其他" ], multi:1 }, { id:"sat", t:"5. 滿意度：請針對您最常使用的平台，勾選同意程度", rows:[ "餐點品質令人滿意", "送達速度令人滿意", "價格（含運費）合理", "客服與問題處理令人滿意", "整體而言我對此平台滿意" ] }, { id:"rec", t:"6. 推薦意願：請勾選同意程度", rows:[ "我願意向親友推薦此平台", "我會在社群/網路上給予正面評價", "若有人詢問，我會建議他使用此平台" ] } ]; const $=id=>document.getElementById(id); /* ========================================================= 建立問卷 ========================================================= */ function build(){ $("qs").innerHTML=Q.map(q=>{ let b; /* ------------------------- 量表題 ------------------------- */ if(q.rows){ b= '<div class="scroll">' + '<table class="lk">' + '<tr>' + '<th></th>' + LK.map((l,i)=> `<th> ${i+1}<br>${l} </th>` ).join("") + "</tr>" + q.rows.map((r,i)=> `<tr> <td>${r}</td>` + LK.map((_,k)=> `<td> <input type="radio" name="${q.id}${i}" value="${k+1}"> </td>` ).join("") + "</tr>" ).join("") + "</table>" + "</div>"; } /* ------------------------- 單選 / 複選 ------------------------- */ else{ b=q.o.map((o,i)=> `<label class="opt"> <input type="${q.multi?"checkbox":"radio"}" name="${q.id}" value="${q.n?i+1:o}"> <span>${o}</span> </label>` ).join(""); } return ` <div class="card" id="c_${q.id}"> <h2 class="${q.req||q.rows?"req":""}"> ${q.t} </h2> ${b} </div> `; }).join(""); } /* ========================================================= LocalStorage ========================================================= */ function load(){ try{ return JSON.parse( localStorage.getItem("resp") || "[]" ); }catch(e){ return[]; } } function save(a){ try{ localStorage.setItem( "resp", JSON.stringify(a) ); }catch(e){ mem=a; } } let mem=[]; function get(){ const a=load(); return a.length ? a : mem; } /* ========================================================= 提交 ========================================================= */ function submitF(){ const fd=new FormData($("f")); const r={}; let bad=null; document .querySelectorAll(".card") .forEach(c=>{ c.style.borderColor=""; }); for(const q of Q){ if(q.rows){ r[q.id]=q.rows.map( (_,i)=>+fd.get(q.id+i)||0 ); if( r[q.id].includes(0) ){ bad=bad||q; } } else if(q.multi){ r[q.id]= fd.getAll(q.id).join("、"); } else{ r[q.id]=fd.get(q.id); if( q.req && !r[q.id] ){ bad=bad||q; } } } if(bad){ $("c_"+bad.id) .style.borderColor="#d93025"; $("c_"+bad.id) .scrollIntoView({ behavior:"smooth", block:"center" }); $("msg").textContent= "請完成標示 * 的必填題目"; return; } $("msg").textContent=""; const a=get(); a.push(r); save(a); $("p1").innerHTML=` <div class="card head"> <h1> 已記錄您的回應 </h1> <div class="sub"> 感謝您的填答！ </div> <br> <button class="btn" onclick="location.reload()"> 提交另一份回應 </button> </div> <div class="ft"> 此為作者：陳建仲自製學術問卷，與任何第三方Google服務無關。 </div> `; } /* ========================================================= 頁面切換 ========================================================= */ function tab(n){ $("p1") .classList .toggle( "hide", n!=1 ); $("p2") .classList .toggle( "hide", n!=2 ); $("t1").className= n==1 ? "on" : ""; $("t2").className= n==2 ? "on" : ""; if(n==2) analyze(); } /* ========================================================= 統計 ========================================================= */ const mean=a=> a.reduce( (s,x)=>s+x, 0 )/a.length; function cor(x,y){ const mx=mean(x); const my=mean(y); let sxy=0, sx=0, sy=0; x.forEach((v,i)=>{ sxy+= (v-mx)* (y[i]-my); sx+= (v-mx)**2; sy+= (y[i]-my)**2; }); return sxy/ Math.sqrt(sx*sy); } function erf(x){ const t= 1/ ( 1+ .3275911* Math.abs(x) ); const y= 1- ( ( ( ( 1.061405429*t- 1.453152027 )*t+ 1.421413741 )*t- .284496736 )*t+ .254829592 )* t* Math.exp(-x*x); return x>=0?y:-y; } const pv=t=> 2* ( 1- .5* ( 1+ erf( Math.abs(t)/ Math.SQRT2 ) ) ); const fp=p=> p<.001 ?" &lt;.001***" :p.toFixed(3)+ ( p<.01 ?"**" :p<.05 ?"*" :"" ); /* ========================================================= 分析 ========================================================= */ function analyze(){ const d=get(); $("n").textContent= "目前有效樣本數 N = "+ d.length+ "（資料存於此瀏覽器，可匯出 CSV）"; if(d.length<10){ $("svg").innerHTML= '<text x="20" y="40">'+ '樣本數需 ≥ 10 才能進行分析（可先按「產生模擬資料」預覽）'+ '</text>'; $("tbl").innerHTML=""; $("note").textContent=""; return; } const F= d.map(r=>+r.freq); const S= d.map(r=>mean(r.sat)); const R= d.map(r=>mean(r.rec)); const n=d.length; const rfs=cor(F,S); const rfr=cor(F,R); const rsr=cor(S,R); const den= 1-rfs*rfs; const a=rfs; const sa= Math.sqrt( (1-a*a)/ (n-2) ); const bs= (rsr-rfr*rfs)/ den; const bf= (rfr-rsr*rfs)/ den; const R2= bs*rsr+ bf*rfr; const se= Math.sqrt( (1-R2)/ ((n-3)*den) ); const ind= a*bs; const sob= Math.sqrt( bs*bs*sa*sa+ a*a*se*se ); const tot= bf+ind; const rows=[ [ "頻率 → 滿意度 (a)", a, sa ], [ "滿意度 → 推薦意願 (b)", bs, se ], [ "頻率 → 推薦意願 (c′ 直接)", bf, se ] ]; let h= '<table class="rs">'+ '<tr>'+ '<th>路徑</th>'+ '<th>β</th>'+ '<th>SE</th>'+ '<th>p</th>'+ '</tr>'+ rows.map(r=> `<tr> <td>${r[0]}</td> <td>${r[1].toFixed(3)}</td> <td>${r[2].toFixed(3)}</td> <td> ${fp( pv(r[1]/r[2]) )} </td> </tr>` ).join(""); h+=` <tr> <td> 間接效果 a×b（Sobel） </td> <td> ${ind.toFixed(3)} </td> <td> ${sob.toFixed(3)} </td> <td> ${fp( pv(ind/sob) )} </td> </tr> <tr> <td> 總效果 c′+a×b </td> <td> ${tot.toFixed(3)} </td> <td></td> <td></td> </tr> `; h+=` <tr> <td> R²（滿意度） </td> <td> ${(a*a).toFixed(3)} </td> <td></td> <td></td> </tr> <tr> <td> R²（推薦意願） </td> <td> ${R2.toFixed(3)} </td> <td></td> <td></td> </tr> </table> `; $("tbl").innerHTML=h; $("note").innerHTML= "* p&lt;.05　"+ "** p&lt;.01　"+ "*** p&lt;.001。"+ "頻率為 1–5 級單題；"+ "滿意度為 5 題平均；"+ "推薦意願為 3 題平均。"+ "採標準化 OLS 路徑分析，"+ "p 值以常態近似；"+ "正式論文建議以 SPSS PROCESS、"+ "AMOS 或 R lavaan 複核，"+ "並檢驗量表信度（Cronbach's α）。"; /* ======================================================= 路徑圖 ======================================================= */ const bx=(x,y,t)=> `<rect x="${x}" y="${y}" width="150" height="60" rx="8" fill="none" stroke="var(--pr)" stroke-width="2"/> <text x="${x+75}" y="${y+36}" text-anchor="middle" font-size="16"> ${t} </text>`; const ar=(x1,y1,x2,y2,l,lx,ly)=> `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--sub)" stroke-width="2" marker-end="url(#m)"/> <text x="${lx}" y="${ly}" text-anchor="middle" font-size="14"> ${l} </text>`; $("svg").innerHTML= '<defs>'+ '<marker '+ 'id="m" '+ 'viewBox="0 0 10 10" '+ 'refX="9" '+ 'refY="5" '+ 'markerWidth="7" '+ 'markerHeight="7" '+ 'orient="auto">'+ '<path '+ 'd="M0 0L10 5L0 10z" '+ 'fill="var(--sub)">'+ '</path>'+ '</marker>'+ '</defs>'+ bx( 245, 20, "滿意度" )+ bx( 20, 170, "使用頻率" )+ bx( 470, 170, "推薦意願" )+ ar( 95, 170, 260, 82, "β="+ a.toFixed(2)+ ( pv(a/sa)<.05 ?"*" :"" ), 130, 110 )+ ar( 380, 82, 545, 170, "β="+ bs.toFixed(2)+ ( pv(bs/se)<.05 ?"*" :"" ), 510, 110 )+ ar( 170, 200, 470, 200, "直接 β="+ bf.toFixed(2)+ ( pv(bf/se)<.05 ?"*" :"" ), 320, 225 )+ `<text x="320" y="252" text-anchor="middle" font-size="13"> 間接效果 = ${ind.toFixed(3)} 　 R²(推薦)=${R2.toFixed(2)} </text>`; } /* ========================================================= 60 筆模擬資料 ========================================================= */ function demo(){ const a=[]; const rn=()=>{ let s=0; for(let i=0;i<6;i++) s+=Math.random(); return (s-3)/.7; }; const cl=x=> Math.max( 1, Math.min( 5, Math.round(x) ) ); for(let i=0;i<60;i++){ const f= cl( 3+ rn()*1.1 ); const s= 3+ .35*(f-3)+ rn()*.7; const rc= 3+ .6*(s-3)+ .15*(f-3)+ rn()*.5; a.push({ gender: ["男","女"][i%2], age: "19–25 歲", freq: String(f), plat: "Uber Eats", sat: [0,0,0,0,0] .map( ()=>cl( s+ rn()*.4 ) ), rec: [0,0,0] .map( ()=>cl( rc+ rn()*.4 ) ) }); } save( get().concat(a) ); analyze(); } /* ========================================================= 清除資料 ========================================================= */ function clr(){ if( confirm( "確定清除所有資料？" ) ){ mem=[]; try{ localStorage.removeItem( "resp" ); }catch(e){} analyze(); } } /* ========================================================= CSV ========================================================= */ function csv(){ const d=get(); if(!d.length) return; const h=[ "gender", "age", "freq", "plat", ...[ 1,2,3,4,5 ].map( i=>"sat"+i ), ...[ 1,2,3 ].map( i=>"rec"+i ) ]; const t=[ h.join(",") ].concat( d.map(r=> [ r.gender, r.age, r.freq, '"'+r.plat+'"', ...r.sat, ...r.rec ].join(",") ) ).join("\n"); const b= new Blob( ["\ufeff"+t], { type:"text/csv" } ); const u= URL.createObjectURL(b); const l= document.createElement("a"); l.href=u; l.download= "survey.csv"; l.click(); } /* ========================================================= 初始化 ========================================================= */ build(); </script> </body> </html>
